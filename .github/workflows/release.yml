name: Release

# Push a tag like `v0.1.0` to build, sign and publish the release APK.
#
# Signing requires these repository secrets (Settings > Secrets and variables
# > Actions):
#   KEYSTORE_BASE64     base64 of the release keystore  (base64 -w0 catch-release.jks)
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
#
# Android refuses to install an unsigned APK ("invalid package" / parse error),
# so this workflow fails fast rather than publishing one.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v:-}" ] || fail "Secret $v is missing. Add it under Settings > Secrets and variables > Actions."
          done

          # Tolerate wrapped, padded or URL-safe paste, then decode.
          clean=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+')
          case $(( ${#clean} % 4 )) in
            2) clean="${clean}==" ;;
            3) clean="${clean}=" ;;
            1) fail "KEYSTORE_BASE64 has an impossible length (${#clean} chars): the value was truncated when it was pasted." ;;
          esac

          if ! printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/tmp/decode.err; then
            echo "first 40 chars: $(printf '%s' "$clean" | head -c 40)"
            echo "length: ${#clean} characters"
            if printf '%s' "$clean" | grep -qiE 'base64|keystore'; then
              fail "KEYSTORE_BASE64 holds the command that produces the value, not the value itself. Set it to the output of: base64 -w0 keystore/catch-release.jks"
            fi
            if printf '%s' "$clean" | grep -q '[^A-Za-z0-9+/=]'; then
              fail "KEYSTORE_BASE64 contains characters that are not base64. The raw keystore (binary) was probably pasted; set it with: gh secret set KEYSTORE_BASE64 --body \"\$(base64 -w0 keystore/catch-release.jks)\""
            fi
            fail "base64 -d failed: $(cat /tmp/decode.err)"
          fi

          # It must actually be a keystore (PKCS#12 starts 0x3082, JKS starts 0xFEDFFEED).
          magic=$(head -c 4 "$RUNNER_TEMP/release.jks" | od -An -tx1 | tr -d ' \n')
          size=$(wc -c < "$RUNNER_TEMP/release.jks")
          case "$magic" in
            3082*|fedffeed) : ;;
            *) fail "Decoded value is not a keystore (first bytes: $magic, $size bytes). It is probably base64 of the wrong file." ;;
          esac
          if [ "$size" -lt 500 ]; then
            fail "Decoded keystore is only $size bytes: KEYSTORE_BASE64 was truncated when pasted. Re-set it with: gh secret set KEYSTORE_BASE64 --body \"\$(base64 -w0 keystore/catch-release.jks)\""
          fi

          # Verifies the password and that the alias exists, before the slow build.
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null \
            || fail "KEYSTORE_PASSWORD does not match the keystore."
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || fail "KEY_ALIAS '$KEY_ALIAS' is not in the keystore."

          echo "CATCH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded ($size bytes) and password/alias verified."

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          CATCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CATCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CATCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK (signature, alignment, manifest)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK is unsigned (only app-release-unsigned.apk exists)."
            exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          BADGING=$("$BT/aapt" dump badging "$APK")
          echo "$BADGING" | head -n 1
          echo "$BADGING" | grep -q "name='com.sabeeir.catchapp'"
          if echo "$BADGING" | grep -qiE "testOnly|debuggable"; then
            echo "::error::Release APK must not be testOnly/debuggable."
            exit 1
          fi
          echo "$BADGING" | grep -q "sdkVersion:'30'"

      - name: Collect artifact
        run: |
          set -euo pipefail
          name="Catch-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > SHA256SUMS.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
        id: artifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/${{ steps.artifact.outputs.name }}
            ${{ runner.temp }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Sideload this APK (it is signed with the Catch release key) and grant
            Catch the Shizuku permission before starting a session.

            - Package: `com.sabeeir.catchapp`
            - Signature: APK Signature Scheme v2, verified by `apksigner` in CI
            - SHA-256: see `SHA256SUMS.txt`
