name: Release

# Push a tag like `v0.1.0` to build the release APK and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing is optional: without the secrets the workflow still publishes the
      # (unsigned) APK, which is enough for sideloading after `apksigner sign`.
      - name: Prepare keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CATCH_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret configured; publishing an unsigned APK."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          CATCH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CATCH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CATCH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect artifact
        id: artifact
        run: |
          set -euo pipefail
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            src=app/build/outputs/apk/release/app-release.apk
          else
            src=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          test -f "$src"
          name="Catch-${GITHUB_REF_NAME}.apk"
          cp "$src" "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > SHA256SUMS.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "signed=${{ steps.keystore.outputs.signed }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/${{ steps.artifact.outputs.name }}
            ${{ runner.temp }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Sideload this APK and grant Catch the Shizuku permission before starting a session.

            - Package: `com.sabeeir.catchapp`
            - Signed: `${{ steps.artifact.outputs.signed }}`
            - SHA-256: see `SHA256SUMS.txt`
